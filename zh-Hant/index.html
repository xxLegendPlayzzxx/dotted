<h1>直接在手機上簽署及填寫 PDF</h1>
<p class="lead">Dotted 可以打開 PDF、掃描檔或照片，讓你簽名、填寫表單，並加上日期、簡簽和勾選記號，接著製作一份簽好的新 PDF 讓你分享。一切都在你的 iPhone 或 iPad 上完成，不用帳號，也不必上傳。</p>
<p><a class="button" href="https://apps.apple.com/app/id6837281407">在 App Store 下載</a></p>
